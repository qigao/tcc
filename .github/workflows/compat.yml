name: Compiler portability POC
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-native:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        backend: [gnu, gas-x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_ASM_COMPILER=gcc -DPOC_ATOMIC_BACKEND=${{ matrix.backend }}
          cmake --build build --parallel 2
          ctest --test-dir build --repeat until-fail:5 --output-on-failure
  linux-tinycc:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable TinyCC source
        run: |
          git clone https://github.com/TinyCC/tinycc.git tools/tinycc
          git -C tools/tinycc checkout --detach e23dabed154a8495f3ac1ff3cc9d04fa1c207893
          cd tools/tinycc
          ./configure --prefix="$GITHUB_WORKSPACE/tools/tcc-installed"
          make -j2
          make install
      - name: Compile test client using TCC + external GAS assembly
        run: |
          cmake -S . -B build-tcc -G Ninja -DCMAKE_C_COMPILER="$GITHUB_WORKSPACE/tools/tcc-installed/bin/tcc" -DCMAKE_ASM_COMPILER=gcc -DPOC_ATOMIC_BACKEND=gas-x86_64
          cmake --build build-tcc --parallel 2
          ctest --test-dir build-tcc --repeat until-fail:5 --output-on-failure
  windows-llvm:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned llvm-mingw (UCRT x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          Invoke-WebRequest -Uri $uri -OutFile llvm-mingw.zip
          $hash = (Get-FileHash llvm-mingw.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') { throw "toolchain hash mismatch: $hash" }
          Expand-Archive llvm-mingw.zip -DestinationPath tools/llvm -Force
          $driver = Get-ChildItem tools/llvm -Recurse -Filter x86_64-w64-mingw32-clang.exe | Select-Object -First 1
          if (-not $driver) { throw 'LLVM Clang driver absent' }
          "LLVM_MINGW_BIN=$($driver.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $driver.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Win32 atomic, thread, event and DLL C ABI
        shell: pwsh
        run: |
          $clang = Join-Path $env:LLVM_MINGW_BIN 'x86_64-w64-mingw32-clang.exe'
          cmake -S . -B build-win -G Ninja "-DCMAKE_C_COMPILER=$clang" -DPOC_ATOMIC_BACKEND=win32
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build-win --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Windows compile failed' }
          ctest --test-dir build-win --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime tests failed' }
      - name: Windows TinyCC, RATL and obfus.h required runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/DosX-dev/TinyCC-builder/releases/download/2026-10-22/tinycc-windows-2026-10-22.zip' -OutFile tinycc.zip
          $hash = (Get-FileHash tinycc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '19990b71f401068306ad699aa80af4afaf7f1a7a0110e791022b99da4cbd92e0') { throw 'TinyCC binary checksum mismatch' }
          Expand-Archive tinycc.zip -DestinationPath tools/tinycc-win -Force
          $tcc = Get-ChildItem tools/tinycc-win -Recurse -Filter tcc.exe | Select-Object -First 1
          if (-not $tcc) { throw 'TCC exe absent' }
          git clone https://github.com/katahiromz/RATL.git tools/ratl
          git -C tools/ratl checkout --detach 2e2efa182d7c6ee9037454d23780991fb8543084
          New-Item -ItemType Directory -Force tools/obfus | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/DosX-dev/obfus.h/52c971a8270e3dd27f3c4fba9f464150b63bf021/include/obfus.h' -OutFile tools/obfus/obfus.h
          ./scripts/windows-interop.ps1 -LLVMRoot $env:LLVM_MINGW_BIN -TinyCCExe $tcc.FullName -RATLRoot (Resolve-Path tools/ratl).Path -ObfusHeader (Resolve-Path tools/obfus/obfus.h).Path
