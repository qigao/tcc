name: WTL10 + OpenATL native llvm-mingw interoperability
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  wtl10-windows-cross:
    name: OpenATL/WTL10 x64 runtime and ARM64 cross-build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA256 pinned llvm-mingw 20261020
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          $sha = (Get-FileHash llvm-mingw.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') { throw "Pinned llvm-mingw mismatch: $sha" }
          Expand-Archive llvm-mingw.zip -DestinationPath tools/llvm -Force
          $clang = Get-ChildItem tools/llvm -Recurse -Filter x86_64-w64-mingw32-clang++.exe | Select-Object -First 1
          if (-not $clang) { throw 'Clang++ missing' }
          "LLVM_MINGW_BIN=$($clang.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install pinned Windows TinyCC x64/ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/DosX-dev/TinyCC-builder/releases/download/2026-10-22/tinycc-windows-2026-10-22.zip'
          Invoke-WebRequest -Uri $url -OutFile tinycc.zip
          $sha = (Get-FileHash tinycc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '19990b71f401068306ad699aa80af4afaf7f1a7a0110e791022b99da4cbd92e0') { throw "Pinned TinyCC mismatch: $sha" }
          Expand-Archive tinycc.zip -DestinationPath tools/tinycc-win -Force
          $tcc64 = Get-ChildItem tools/tinycc-win -Recurse -Filter tcc.exe | Select-Object -First 1
          $tccArm = Get-ChildItem tools/tinycc-win -Recurse -Filter arm64-win32-tcc.exe | Select-Object -First 1
          if (-not $tcc64 -or -not $tccArm) { throw 'Pinned TinyCC x64/ARM64 missing' }
          "POC_TCC64=$($tcc64.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "POC_TCCARM=$($tccArm.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Exact WTL10 release and OpenATL C++17 DLL into TinyCC C
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/windows-wtl10-openatl.ps1 -LLVMRoot $env:LLVM_MINGW_BIN -TinyCC64 $env:POC_TCC64 -TinyCCArm $env:POC_TCCARM
          if ($LASTEXITCODE -ne 0) { throw 'WTL10/OpenATL x64/ARM64 test failed' }
      - name: Comprehensive WTL10/wtltest SDI compilation (required)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inc = Get-ChildItem tools/wtl10 -Recurse -Filter atlapp.h | Where-Object {
            $_.FullName -match '[\\/]include[\\/]atlapp\.h$'
          } | Select-Object -First 1
          if (-not $inc) { throw 'Missing actual WTL10 include dir' }
          $include = $inc.Directory.FullName
          $atl = (Resolve-Path tools/wtl10-openatl/include).Path
          $wtltest = (Resolve-Path tools/wtl10-test).Path
          foreach ($cpu in @('x86_64','aarch64')) {
            $cxx = Join-Path $env:LLVM_MINGW_BIN "$cpu-w64-mingw32-clang++.exe"
            $args_ = @('-fsyntax-only','-std=c++17','-DUNICODE','-D_UNICODE',
              '-D_WIN32_WINNT=0x0601','-DWINVER=0x0601','-D_WIN32_IE=0x0601',
              "-I$atl","-I$include","-I$wtltest",(Join-Path $wtltest 'main.cpp'))
            & $cxx @args_
            if ($LASTEXITCODE -ne 0) { throw "WTL10 SDI sample compile failed: $cpu" }
          }
          Write-Host 'WTL10 SDI, controls and dialogs sample C++17 compiled on x64/ARM64'
      - name: Link upstream WTL10 SDI executable and resource files (diagnostic)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inc = Get-ChildItem tools/wtl10 -Recurse -Filter atlapp.h | Where-Object {
            $_.FullName -match '[\\/]include[\\/]atlapp\.h
        uses: actions/upload-artifact@v4
        with:
          name: wtl10-openatl-arm64-runtime
          path: |
            build-wtl10/poc_openatl_wtl10_arm64.dll
            build-wtl10/wtl10_client_arm64.exe
            build-wtl10/manifest.json
          if-no-files-found: warn

  wtl10-arm64-native:
    name: OpenATL + WTL10 TinyCC C ABI actual Windows ARM64
    needs: wtl10-windows-cross
    if: needs.wtl10-windows-cross.result == 'success'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wtl10-openatl-arm64-runtime
          path: wtl10-arm64
      - name: Verify PE machine and SHA-256 and execute
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'Arm64') { throw 'Native Windows ARM64 runner required' }
          $manifest = Get-Content wtl10-arm64/manifest.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($filename in @('poc_openatl_wtl10_arm64.dll','wtl10_client_arm64.exe')) {
            $path = (Resolve-Path "wtl10-arm64/$filename").Path
            [byte[]]$raw = [IO.File]::ReadAllBytes($path)
            if ($raw.Length -lt 128) { throw "Tiny PE: $filename" }
            $pe = [BitConverter]::ToInt32($raw, 0x3c)
            if ($pe -lt 64 -or $pe + 6 -ge $raw.Length -or
                [BitConverter]::ToUInt16($raw, $pe + 4) -ne 0xAA64) { throw "Not ARM64 PE: $filename" }
            $sha = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sha -ne $manifest[$filename]) { throw "ARM64 provenance mismatch: $filename" }
          }
          Push-Location wtl10-arm64
          try {
            for ($i = 1; $i -le 5; $i++) {
              & ./wtl10_client_arm64.exe poc_openatl_wtl10_arm64.dll
              if ($LASTEXITCODE -ne 0) { throw "Native ARM64 WTL10 ABI failed run $i" }
            }
          } finally { Pop-Location }
          Write-Host 'Native Windows ARM64 WTL10/OpenATL/TinyCC C ABI 5/5 PASS'

          } | Select-Object -First 1
          if (-not $inc) { throw 'Missing actual pinned WTL10 headers' }
          $atl = (Resolve-Path tools/wtl10-openatl/include).Path
          $demo = (Resolve-Path tools/wtl10-test).Path
          foreach ($arch in @('x86_64','aarch64')) {
            $cxx = Join-Path $env:LLVM_MINGW_BIN "$arch-w64-mingw32-clang++.exe"
            $windres = Join-Path $env:LLVM_MINGW_BIN "$arch-w64-mingw32-windres.exe"
            $out = "build-wtl10/full_wtltest_$arch.exe"
            $obj = "build-wtl10/wtltest_$arch.res.o"
            if (-not (Test-Path $windres)) { throw "Resource compiler absent: $windres" }
            & $windres '-i' (Join-Path $demo 'wtltest.rc') '-I' $demo '-O' 'coff' '-o' $obj
            if ($LASTEXITCODE -ne 0) { throw "Full WTL10 resource compilation failed: $arch" }
            $args_ = @('-std=c++17','-DUNICODE','-D_UNICODE','-municode',
              '-D_WIN32_WINNT=0x0601','-DWINVER=0x0601','-D_WIN32_IE=0x0601',
              "-I$atl","-I$($inc.Directory.FullName)","-I$demo",
              (Join-Path $demo 'main.cpp'),$obj,'-o',$out,
              '-static','-lcomctl32','-lmsimg32','-lole32','-loleaut32',
              '-luuid','-luxtheme','-lgdi32','-lcomdlg32',
              '-lshell32','-lshlwapi','-ldwmapi','-luser32')
            & $cxx @args_
            if ($LASTEXITCODE -ne 0) { throw "Full WTL10 SDI executable link failed: $arch" }
            Write-Host "Comprehensive full WTL10 sample executable built: $out"
          }
      - name: Save WTL10 provenance for native ARM64 runner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wtl10-openatl-arm64-runtime
          path: |
            build-wtl10/poc_openatl_wtl10_arm64.dll
            build-wtl10/wtl10_client_arm64.exe
            build-wtl10/manifest.json
          if-no-files-found: warn

  wtl10-arm64-native:
    name: OpenATL + WTL10 TinyCC C ABI actual Windows ARM64
    needs: wtl10-windows-cross
    if: needs.wtl10-windows-cross.result == 'success'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wtl10-openatl-arm64-runtime
          path: wtl10-arm64
      - name: Verify PE machine and SHA-256 and execute
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'Arm64') { throw 'Native Windows ARM64 runner required' }
          $manifest = Get-Content wtl10-arm64/manifest.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($filename in @('poc_openatl_wtl10_arm64.dll','wtl10_client_arm64.exe')) {
            $path = (Resolve-Path "wtl10-arm64/$filename").Path
            [byte[]]$raw = [IO.File]::ReadAllBytes($path)
            if ($raw.Length -lt 128) { throw "Tiny PE: $filename" }
            $pe = [BitConverter]::ToInt32($raw, 0x3c)
            if ($pe -lt 64 -or $pe + 6 -ge $raw.Length -or
                [BitConverter]::ToUInt16($raw, $pe + 4) -ne 0xAA64) { throw "Not ARM64 PE: $filename" }
            $sha = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sha -ne $manifest[$filename]) { throw "ARM64 provenance mismatch: $filename" }
          }
          Push-Location wtl10-arm64
          try {
            for ($i = 1; $i -le 5; $i++) {
              & ./wtl10_client_arm64.exe poc_openatl_wtl10_arm64.dll
              if ($LASTEXITCODE -ne 0) { throw "Native ARM64 WTL10 ABI failed run $i" }
            }
          } finally { Pop-Location }
          Write-Host 'Native Windows ARM64 WTL10/OpenATL/TinyCC C ABI 5/5 PASS'


  wtl10-nonwindows-cross:
    name: WTL10 on ${{ matrix.host }} llvm-mingw cross compiler
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Linux
            runner: ubuntu-24.04
            archive: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz
            sha256: 55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335
          - host: macOS
            runner: macos-15
            archive: llvm-mingw-20261020-ucrt-macos-universal.tar.xz
            sha256: e9c13e4ede38e715003ffc674d4d00a1088df8235439d1f0c16188ff0704c17e
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SHA256 pinned host llvm-mingw and immutable WTL10/OpenATL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/llvm-host tools/wtl10 build-wtl10
          curl -fL --retry 3 --retry-delay 3 -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/${{ matrix.archive }}"
          echo '${{ matrix.sha256 }}  llvm-mingw.tar.xz' | shasum -a 256 -c -
          tar -xJf llvm-mingw.tar.xz -C tools/llvm-host
          BIN="$(find "$PWD/tools/llvm-host" -type f -name x86_64-w64-mingw32-clang++ -print -quit)"
          test -n "$BIN" && test -x "$BIN"
          echo "MINGW_BIN=$(dirname "$BIN")" >> "$GITHUB_ENV"
          curl -fL --retry 3 -o build-wtl10/wtl10.zip \
            'https://raw.githubusercontent.com/Win32-WTL/WTL/065ef5597383c1231bd4892cf8e94331b29bdb97/Releases/WTL10_10320_Final.zip'
          test "$(git hash-object build-wtl10/wtl10.zip)" = 'a9f9d84495aac2155b0fdb00fec0e421b0e75c90'
          echo '13de5cd7ed41454b8f287e9bcc4525234c6ac8c85905e4d4fe1a0776709fd78f  build-wtl10/wtl10.zip' | shasum -a 256 -c -
          unzip -q build-wtl10/wtl10.zip -d tools/wtl10
          git clone --quiet https://github.com/kkhaike/openatl.git tools/wtl10-openatl
          git -C tools/wtl10-openatl checkout --quiet --detach 7b587f3e10f3f8d93a01522033de80007368bad5
          test "$(git -C tools/wtl10-openatl rev-parse HEAD)" = '7b587f3e10f3f8d93a01522033de80007368bad5'
          git clone --quiet https://github.com/kkhaike/wtltest.git tools/wtl10-test
          git -C tools/wtl10-test checkout --quiet --detach 63ba6a992cb3d79d56be66cd283f6615c6646b3d
          test "$(git -C tools/wtl10-test rev-parse HEAD)" = '63ba6a992cb3d79d56be66cd283f6615c6646b3d'
          HEADER="$(find "$PWD/tools/wtl10" -type f -iname atlapp.h -print -quit)"
          test -f "$HEADER"
          grep -qi 'WTL version 10.0' "$HEADER"
          echo "WTL10_INC=$(dirname "$HEADER")" >> "$GITHUB_ENV"
      - name: Cross-compile actual WTL10 + OpenATL for x64 and ARM64
        shell: bash
        run: |
          set -euo pipefail
          ATL="$PWD/tools/wtl10-openatl/include"
          TEST="$PWD/tools/wtl10-test"
          for arch in x86_64 aarch64; do
            CC="$MINGW_BIN/${arch}-w64-mingw32-clang++"
            test -x "$CC"
            flags=(-std=c++17 -O0 -DUNICODE -D_UNICODE
              -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 -D_WIN32_IE=0x0601
              "-I$ATL" "-I$WTL10_INC" "-I$TEST")
            "$CC" "${flags[@]}" -fsyntax-only \
              tests/wtl10/openatl_wtl10_bridge.cpp \
              "$TEST/main.cpp"
            output="build-wtl10/poc_openatl_wtl10_${arch}.dll"
            "$CC" "${flags[@]}" -shared \
              tests/wtl10/openatl_wtl10_bridge.cpp -o "$output" \
              -static -loleaut32 -lole32 -luuid -lcomctl32 \
              -lgdi32 -luser32 -lshell32 -lshlwapi \
              -lcomdlg32 -luxtheme -lmsimg32
            python3 - "$output" "$arch" <<'PY'
          import pathlib, struct, sys
          b = pathlib.Path(sys.argv[1]).read_bytes()
          assert b[:2] == b'MZ' and len(b) > 128, 'Not a valid PE'
          off = struct.unpack_from('<I', b, 0x3c)[0]
          assert b[off:off+4] == b'PE\x00\x00', 'PE magic missing'
          machine = struct.unpack_from('<H', b, off+4)[0]
          expected = {'x86_64': 0x8664, 'aarch64': 0xaa64}[sys.argv[2]]
          assert machine == expected, (hex(machine), hex(expected))
          print(f'Windows PE target {sys.argv[2]} verified: {sys.argv[1]}')
          PY
          done
          echo 'Non-Windows host WTL10/OpenATL cross-compile x64+ARM64 PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wtl10-host-${{ matrix.host }}-evidence
          path: build-wtl10/*.dll
          if-no-files-found: warn
